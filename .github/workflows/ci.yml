name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AgentControlBE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentControlBE/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AgentControlFE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentControlFE/package-lock.json
            AgentControlBE/package-lock.json
      - run: npm ci
      # tests/skills.test.mjs imports AgentControlBE/src/db/skill-md.ts, which needs the backend's deps (yaml).
      - name: npm ci (AgentControlBE, for the shared skill parser test)
        run: npm ci
        working-directory: AgentControlBE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
