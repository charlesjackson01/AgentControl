name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AgentControlBE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentControlBE/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AgentControlFE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentControlFE/package-lock.json
            AgentControlBE/package-lock.json
      - run: npm ci
      # tests/skills.test.mjs imports AgentControlBE/src/db/skill-md.ts, which needs the backend's deps (yaml).
      - name: npm ci (AgentControlBE, for the shared skill parser test)
        run: npm ci
        working-directory: AgentControlBE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # FE-P2-8. Decision 2: Playwright on PRs and master. No @vm, @win, or @mac job.
  # The @vm smoke stays skipped: this job does not set AC_VM_TESTS.
  frontend-e2e:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AgentControlFE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentControlFE/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            AgentControlFE/e2e/artifacts/**
            AgentControlFE/test-results/**
          if-no-files-found: warn
