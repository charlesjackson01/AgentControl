<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>AgentControl · Project room</title>
<link rel="stylesheet" href="/chat/tokens.css?v=3.1"><link rel="stylesheet" href="/chat/chat.css?v=3.1">
<script defer src="/chat/core.js?v=3.1"></script><script defer src="/chat/model.js?v=3.1"></script><script defer src="/chat/thread.js?v=3.1"></script><script defer src="/chat/shell.js?v=3.1"></script></head>
<body><section id="sign-in"><form id="connect-form"><p class="eyebrow">AgentControl</p><h1>Your project room</h1><p>Connect with the dashboard key printed in your server terminal.</p><label for="dashboard-key">Dashboard key</label><input id="dashboard-key" type="password" autocomplete="current-password" required><label class="remember"><input id="remember-key" type="checkbox"> Remember on this device</label><p id="sign-in-error" role="alert"></p><button type="submit">Connect</button></form></section>
<div id="app" hidden><div id="banner" role="alert" hidden><span id="banner-text"></span><button id="dismiss-error" aria-label="Dismiss error">×</button></div><button id="scrim" hidden aria-label="Close panels"></button><nav id="rail" aria-label="Project navigation"></nav><main id="room"><header id="room-header"></header><div id="timeline" aria-label="Project conversation"><p>Connecting…</p></div><footer><div id="waiting"></div><label for="composer" class="eyebrow">Project room</label><textarea id="composer" disabled placeholder="Messaging from this view is coming soon. Use the classic dashboard to start or steer a session."></textarea><a href="/classic">Open classic dashboard</a></footer></main><aside id="context" aria-label="Session context" hidden></aside></div></body></html>
