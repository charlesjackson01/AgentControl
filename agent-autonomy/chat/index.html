<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>AgentControl · Project room</title>
<link rel="stylesheet" href="/chat/tokens.css?v=4"><link rel="stylesheet" href="/chat/chat.css?v=7">
<script defer src="/chat/core.js?v=7"></script><script defer src="/chat/model.js?v=7"></script><script defer src="/chat/thread.js?v=7"></script><script defer src="/chat/decisions.js?v=7"></script><script defer src="/chat/composer.js?v=7"></script><script defer src="/chat/members.js?v=7"></script><script defer src="/chat/workspace.js?v=7"></script><script defer src="/chat/shell.js?v=7"></script></head>
<body><section id="sign-in"><form id="connect-form"><p class="eyebrow">AgentControl</p><h1>Your project room</h1><p>Connect with the dashboard key printed in your server terminal.</p><label for="dashboard-key">Dashboard key</label><input id="dashboard-key" type="password" autocomplete="current-password" required><label class="remember"><input id="remember-key" type="checkbox"> Remember on this device</label><p id="sign-in-error" role="alert"></p><button type="submit">Connect</button></form></section>
<div id="app" hidden><div id="banner" role="alert" hidden><span id="banner-text"></span><button id="dismiss-error" aria-label="Dismiss error">×</button></div><button id="scrim" hidden aria-label="Close panels"></button><nav id="rail" aria-label="Project navigation"></nav><main id="room"><header id="room-header"></header><div id="timeline" aria-label="Project conversation"><p>Connecting…</p></div><footer id="room-footer"><div id="waiting"></div><div id="composer-host"><div id="composer-options" role="listbox" aria-label="Composer suggestions" hidden></div><div class="composer-row"><span id="composer-target" class="target-chip">New session</span><button id="cancel-follow-up" aria-label="Cancel follow-up" hidden>×</button><button id="resume-session" hidden>Resume</button><label for="composer" class="visually-hidden">Message the project room</label><textarea id="composer" rows="1" placeholder="Start a new session…" aria-haspopup="listbox" aria-controls="composer-options" aria-expanded="false"></textarea><button id="composer-settings" aria-label="Settings" aria-controls="settings-sheet">⚙<span class="settings-label"> Settings</span></button><button id="send-message">Send</button></div><p id="composer-blocked" hidden></p><button id="check-connections" hidden>Check again</button><p id="composer-status" role="status" hidden></p><a id="composer-classic" href="/classic" hidden>Open classic dashboard</a></div></footer></main><aside id="context" aria-label="Session context" hidden></aside><aside id="workspace" aria-label="Agent Workspace" hidden></aside><button id="settings-scrim" aria-label="Close Settings" hidden></button><aside id="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><header><h2 id="settings-title">Settings</h2><button id="close-settings" aria-label="Close Settings">×</button></header><div id="settings-fields"></div><label id="dirty-acknowledgement" hidden><input type="checkbox" id="allow-dirty"> Start anyway with uncommitted changes</label></aside><dialog id="stop-dialog" aria-labelledby="stop-title"><h2 id="stop-title"></h2><p>The current turn is aborted and the session ends. This cannot be resumed.</p><div><button id="confirm-stop">Stop session</button><button id="cancel-stop" autofocus>Cancel</button></div></dialog><dialog id="decision-dialog" aria-labelledby="decision-title"></dialog></div></body></html>
